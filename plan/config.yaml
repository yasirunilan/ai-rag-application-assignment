# Course 3 — Day 2 · Lab A: Multimodal Retrieval Configuration
# Every model and failure-mode ablation toggle is controlled from this single file.
# Non-negotiable: No paid API key is permitted on the default path (:free enforced in code).

project:
  name: "mmrag-technical-manuals"
  data_dir: "data"
  artifacts_dir: "data/artifacts"
  cache_dir: "data/cache/captions"
  index_dir: "data/index"
  review_queue_path: "data/review_queue.jsonl"
  reports_dir: "reports"

corpus:
  eval_dataset: "dude_slice"          # Options: "dude_slice" | "mp_docvqa_slice"
  real_manual: "amt_handbook"         # Options: "amt_handbook" | "ifixit_guides"
  max_pages: 250                      # Story E0.2: Cap corpus to a few hundred pages for fast iteration
  gold_eval_path: "data/corpus/gold_eval.jsonl"
  manuals_dir: "data/corpus/manuals"

ingest:
  # Story E1.1: Structural parser backend ("pymupdf" default light core | "docling" optional heavy adapter)
  parser_backend: "pymupdf"
  # Story E1.2: Scanned-page detection & OCR quality gate
  scanned_max_text_chars: 50
  scanned_min_image_coverage: 0.60
  ocr_engine: "tesseract"             # Options: "tesseract" | "heuristic_fallback"
  ocr_quality_gate:
    enabled: true                     # Set false to reproduce Appendix Failure Mode: "Scanned-text noise in results"
    min_mean_confidence: 60.0         # 0-100 scale from Tesseract word-level confidences
    max_garbled_char_ratio: 0.15      # Max fraction of non-printable/symbol-noise chars
    min_alnum_token_ratio: 0.50       # Min fraction of tokens with >=2 alphanumeric chars

extract:
  # Story E2.1: Figure crop export & rule/icon filter
  figure_render_dpi: 200
  min_figure_width_pt: 70.0
  min_figure_height_pt: 55.0
  min_figure_area_pt2: 5000.0
  min_aspect_ratio: 0.15
  max_aspect_ratio: 6.50
  caption_search_margin_pt: 45.0
  # Story E2.2: Structured table extraction
  table_backend: "pdfplumber"         # Options: "pdfplumber" | "pymupdf"
  flatten_tables: false               # Set true ONLY to reproduce Failure Mode 2 ("Table answers are mush")

enrich:
  # Story E3.1: Vision captioning (free OpenRouter <-> local model <-> offline heuristic)
  vision_provider: "openrouter_free"  # Options: "openrouter_free" | "local_vision" | "offline_heuristic"
  enforce_free_only: true             # Raises BillingGuardError if any OpenRouter model lacks ':free'
  openrouter_models:
    - "qwen/qwen2.5-vl-72b-instruct:free"
    - "qwen/qwen2.5-vl-7b-instruct:free"
    - "meta-llama/llama-3.2-11b-vision-instruct:free"
    - "mistralai/mistral-small-3.1-24b-instruct:free"
    - "openrouter/free"
  local_vision_model: "Qwen/Qwen2-VL-2B-Instruct"
  cache_enabled: true
  selective_captioning: true          # Only caption validated figure crops (prevents "Vision cost blowout")
  # E7.3 Failure Mode 1 Fix ("Right text, wrong figure" / caption-image drift):
  include_nearby_context: true        # Injects nearby figure caption, heading, and model/variant terms into search_text
  # Story E3.2 & E7.3 Failure Mode 2 Fix ("Table answers are mush"):
  table_linearization_mode: "col_val_and_markdown"  # Options: "col_val_and_markdown" | "flat_raw"

index:
  # Story E4.1 & E4.2: Single mixed index over text + figure + table with provenance metadata
  embedding_provider: "local_bge"     # Options: "local_bge" (fastembed bge-small-en-v1.5) | "deterministic_hash" (offline smoke)
  embedding_model_name: "BAAI/bge-small-en-v1.5"
  embedding_dim: 384
  vector_backend: "faiss_or_numpy"    # Uses FAISS IndexFlatIP if faiss-cpu installed, else exact L2-normalized NumPy IP
  prose_chunk_max_chars: 750
  prose_chunk_overlap_chars: 100

retrieve:
  # Story E5.1 & E5.2: Dense + BM25 lexical fusion for exact part/fault identifiers
  top_k: 5
  candidate_pool_size: 50
  enable_bm25_fusion: true            # Set false (or alpha=1.0) to reproduce vector-only part-number smearing
  alpha: 0.60                         # Weight on dense vector score (1 - alpha on BM25 score)

answer:
  # Story E6.1 & E6.2: Answer with real artefact + fail-closed provenance gate
  fail_closed_on_missing_provenance: true
  min_score_threshold: 0.05
  promote_explicit_modality_intent: true  # Promotes co-retrieved figure/table on same page when query explicitly asks for diagram/table
  min_query_term_coverage: 0.25       # Abstain ("nothing relevant retrieved") when the cited unit covers < 25% of query terms; 0 disables
